[package]
name = "spintracker-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
rayon = "1"
regex = "1"
lru = "0.12"
serde_repr = "0.1"

[dev-dependencies]
tempfile = "3"
