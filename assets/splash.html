<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #0b1220, #08101a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Segoe UI, Roboto, Arial;
      color: #e6eef8
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 36px;
      border-radius: 12px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px
    }

    .logo svg {
      width: 36px;
      height: 36px;
      color: #061226
    }

    .message {
      font-size: 15px;
      font-weight: 600
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      <!-- TrendingUp icon SVG -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 17l6-6 4 4 8-8" />
        <path d="M14 7h6v6" />
      </svg>
    </div>
    <div class="message">Chargement des données...</div>
  </div>
</body>

</html>
