<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SpinTracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1f2e; /* Dark theme background */
            color: #e2e8f0; /* Light text */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            object-fit: contain;
            /* Simple pulse animation */
            animation: pulse 2s infinite ease-in-out;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        .loader {
            margin-top: 24px;
            width: 40px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            margin-left: auto;
            margin-right: auto;
        }

        .loader-bar {
            width: 100%;
            height: 100%;
            background: #3b82f6; /* Blue accent */
            border-radius: 2px;
            animation: loading 1.5s infinite ease-in-out;
            transform-origin: 0% 50%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="SpinTracker" class="logo">
        <div class="title">SpinTracker</div>
        <div class="subtitle" id="status-text">Loading...</div>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>

    <script src="splash.js"></script>
</body>
</html>
