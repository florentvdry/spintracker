name: Release

# Un commit sur main dont le message commence par "V<major>.<minor>.<patch>"
# (ex: "V1.2.0", "V1.2.0 - nouvelle analyse de range") construit l'installeur
# Windows, cree le tag v<version> et publie la release avec ses notes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier (ex: 1.2.0) depuis le dernier commit de main"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            version="${INPUT#v}"
          else
            first="$(printf '%s' "$MSG" | head -n1)"
            version="$(printf '%s' "$first" | sed -nE 's/^[Vv]([0-9]+\.[0-9]+\.[0-9]+)([^0-9.].*)?$/\1/p')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ -n "$version" ] && echo "Release v$version" || echo "Pas de commit de version, rien a publier."

  release:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le tag n'existe pas
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Le tag v$VERSION existe deja"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Version de l'application
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # tauri.conf.json reads the version from package.json; keep Cargo.toml in sync.
          sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Dependances
        run: |
          npm ci --ignore-scripts
          npm --prefix frontend ci

      - name: Installeur Tauri (frontend + app, signe pour l'updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Manifestes d'update (Tauri latest.json + passerelle electron-updater latest.yml)
        run: |
          bundle="target/release/bundle/nsis"
          installer="$(ls "$bundle"/*-setup.exe | head -n1)"
          name="$(basename "$installer")"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$name"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Tauri updater manifest (new clients).
          node -e '
            const fs = require("fs");
            const [, , version, url, sigPath, now] = process.argv;
            const signature = fs.readFileSync(sigPath, "utf8").trim();
            fs.writeFileSync("latest.json", JSON.stringify({
              version, notes: "", pub_date: now,
              platforms: { "windows-x86_64": { signature, url } }
            }, null, 2));
          ' "$VERSION" "$url" "$installer.sig" "$now"

          # electron-updater manifest: lets installed Electron builds discover and download
          # this installer. Best effort bridge, to be removed once users have migrated.
          sha512="$(openssl dgst -sha512 -binary "$installer" | openssl base64 -A)"
          size="$(stat -c %s "$installer")"
          cat > latest.yml <<YML
          version: $VERSION
          files:
            - url: $name
              sha512: $sha512
              size: $size
          path: $name
          sha512: $sha512
          releaseDate: '$now'
          YML
          cat latest.json latest.yml

      - name: Notes de release
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          {
            echo "## SpinTracker v$VERSION"
            echo
            if [ -n "$prev" ]; then
              range="$prev..HEAD"
              echo "### Changements depuis $prev"
            else
              range="HEAD"
              echo "### Changements"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s (%h)' \
              --invert-grep --grep='^[Vv][0-9]' --grep='\[skip ci\]' -n 100
            echo
            echo "### Fichiers modifies"
            echo
            echo '```'
            if [ -n "$prev" ]; then
              git diff --stat=100 "$prev" HEAD -- . ':(exclude)package-lock.json' ':(exclude)*/package-lock.json' | tail -n 40
            else
              git show --stat=100 --format= HEAD | tail -n 40
            fi
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Comparaison complete** : https://github.com/${GITHUB_REPOSITORY}/compare/$prev...v$VERSION"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Creer la release
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "SpinTracker v$VERSION" \
            --notes-file release-notes.md \
            target/release/bundle/nsis/*-setup.exe \
            target/release/bundle/nsis/*-setup.exe.sig \
            latest.json \
            latest.yml
