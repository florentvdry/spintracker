name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Tests
        run: cargo test -p spintracker-core --release
      - name: Lints
        run: cargo clippy -p spintracker-core --all-targets
