name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Tests
        run: cargo test -p spintracker-core
      - name: Lints
        run: cargo clippy -p spintracker-core --all-targets
      - name: Desktop shell
        run: cargo check -p spintracker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm run test
      - name: Type check and build
        run: npm run build
