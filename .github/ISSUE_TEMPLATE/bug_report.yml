name: 🐛 Bug report
description: Something is broken or behaves unexpectedly in SpinTracker.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Never paste real hand histories with player names or personal data.** Anonymize them first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / parser
        - Dashboard
        - Statistics / leaks
        - Replayer
        - Range research
        - History / players / multipliers
        - Auto-update / installer
        - Other
    validations:
      required: true
  - type: dropdown
    id: room
    attributes:
      label: Poker room (if relevant)
      options:
        - Not applicable
        - Winamax
        - Betclic
        - Unibet
        - Other
  - type: input
    id: version
    attributes:
      label: SpinTracker version
      placeholder: e.g. 1.1.8
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or anonymized hand history sample
      description: Drag and drop files here. Remove any player names or personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed personal data and player names from everything I attached.
          required: true
